<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS機系統</title>
    <!-- P8：整體視覺重構——原本沒有指定任何字體，全部吃瀏覽器預設字型。
         Noto Sans TC 對繁體中文的排版品質（字重、字腔）比系統預設好，
         離線時（PWA，見 vite.config.ts 的說明）會優雅退回 fallback
         字型，不影響離線可用性。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <!-- 搶在 hash 模式路由把 #session=... 誤判成路徑並正規化（弄壞第一個參數）之前，先存下原始 OAuth 回呼 hash -->
    <script>
      (function () {
        var hash = window.location.hash
        if (hash.length > 1 && hash[1] !== '/') {
          window.__oauthCallbackHash = hash
          history.replaceState(null, '', window.location.pathname + window.location.search)
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
