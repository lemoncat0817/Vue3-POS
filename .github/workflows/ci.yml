# CI on PRs; deploy frontend (GitHub Pages) + backend (Cloudflare Workers) from master.
#
# Required GitHub Actions secrets:
#   CLOUDFLARE_API_TOKEN    — already configured; wrangler deploy (Workers Edit + Account read)
#
# 裝置憑證不再是 build-time 塞進前端的 secret（那樣會把憑證烤進公開的
# GitHub Pages bundle）——改成登入當下才核發，見 apps/api/src/routes/oauth.ts
# 與 apps/pos/src/api/oauth.ts。
#
# Optional secret or variable:
#   CLOUDFLARE_ACCOUNT_ID   — cc1bea6538e772965248fa1fdef2844c (set if wrangler cannot infer the account)
#
# Required GitHub Actions variables (already configured):
#   VITE_API_BASE_URL       — https://pos-api.jimdeng0817.workers.dev
#   VITE_BASE_PATH          — /pos-system/
#
# Repo Settings → Pages → Source must be "GitHub Actions" (not the legacy gh-pages branch).
# D1 migrations 隨 deploy-api 自動套用到 remote；seed 仍是一次性 ops 步驟，不在這裡跑。

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, refactor/modernization]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # engines allow >=20.19; Node 20.20 + better-sqlite3 segfaults here
  # (vitest surfaces that as tinypool ERR_IPC_CHANNEL_CLOSED).
  NODE_VERSION: '22'

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  deploy-frontend:
    name: Deploy frontend (GitHub Pages)
    needs: quality
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: pnpm --filter @pos/app build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/pos/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-api:
    name: Deploy API (Cloudflare Workers)
    needs: quality
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # migration 先套用再部署 Worker，避免新程式碼在交錯期打到舊 schema；
      # seed 仍是一次性 ops 步驟，不在這裡跑。
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: d1 migrations apply pos-db --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Prefer the repository variable; fall back to a secret of the same name.
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: deploy
