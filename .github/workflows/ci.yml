# CI on PRs; deploy frontend (GitHub Pages) + backend (Cloudflare Workers) from master.
#
# Required GitHub Actions secrets:
#   VITE_DEVICE_TOKEN       — already configured; baked into the frontend production build
#   CLOUDFLARE_API_TOKEN    — still needed; wrangler deploy (Workers Edit + Account read)
#
# Optional secret or variable:
#   CLOUDFLARE_ACCOUNT_ID   — cc1bea6538e772965248fa1fdef2844c (set if wrangler cannot infer the account)
#
# Required GitHub Actions variables (already configured):
#   VITE_API_BASE_URL       — https://pos-api.jimdeng0817.workers.dev
#   VITE_BASE_PATH          — /Vue3-POS/
#
# Repo Settings → Pages → Source must be "GitHub Actions" (not the legacy gh-pages branch).
# D1 migrate/seed is an ops step and is intentionally not run here.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, refactor/modernization]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        # Same gate as `pnpm test`, but serialise workspaces. On 2-core
        # runners, recursive vitest (jsdom + better-sqlite3) can crash
        # tinypool with ERR_IPC_CHANNEL_CLOSED.
        run: pnpm -r --workspace-concurrency=1 --if-present run test
        env:
          VITEST_MAX_FORKS: 1
          VITEST_MAX_THREADS: 1

  deploy-frontend:
    name: Deploy frontend (GitHub Pages)
    needs: quality
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_DEVICE_TOKEN: ${{ secrets.VITE_DEVICE_TOKEN }}
        run: pnpm --filter @pos/app build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/pos/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-api:
    name: Deploy API (Cloudflare Workers)
    needs: quality
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Worker only — do not run `d1 migrations apply` / seed on every deploy.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Prefer the repository variable; fall back to a secret of the same name.
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: pnpm
          command: deploy
